name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test with GUNDAM engine
    runs-on: ubuntu-latest
    container:
      image: nadrino/gundam:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify GUNDAM Python bindings
        run: python -c "import GUNDAM; print('GUNDAM loaded from', GUNDAM.__file__)"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -v

      - name: Run ruff
        run: python -m ruff check .

  build:
    name: Build package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build package
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
