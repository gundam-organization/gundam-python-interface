name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test with GUNDAM engine
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build the GUNDAM test image
        run: |
          docker build \
            --platform linux/amd64 \
            --tag gundam-python-interface-ci \
            .

      - name: Run tests with the GUNDAM engine
        run: >-
          docker run --rm --platform linux/amd64 --workdir /workspace
          gundam-python-interface-ci python -m pytest -v tests
          --gundam-lib-path /home/work/install/lib

      - name: Run ruff
        run: docker run --rm --platform linux/amd64 --workdir /workspace gundam-python-interface-ci python -m ruff check .

  build:
    name: Build package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build package
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
