name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test with GUNDAM engine
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run tests with the GUNDAM Docker image
        run: |
          docker run --rm \
            --platform linux/amd64 \
            --volume "${GITHUB_WORKSPACE}:/workspace" \
            --workdir /workspace \
            nadrino/gundam:latest \
            bash -lc '
              python -c "import GUNDAM; print(\"GUNDAM loaded from\", GUNDAM.__file__)"
              python -m pip install --upgrade pip
              python -m pip install -e ".[dev]"
              python -m pytest -v
              python -m ruff check .
            '

  build:
    name: Build package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build package
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
